
<main id="contenido">

<div class="contenedor disposicion-form">
  <div class="texto">
    <h1>Elige una contraseña nueva</h1>
    <p>Escribe la contraseña que usarás de ahora en adelante. Al guardarla, se cerrarán todas las sesiones anteriores de tu cuenta.</p>
  </div>
  <div>
    <div id="estadoToken"></div>
    <form class="form-card" id="formRestablecer" data-validar data-manual data-confirmar-password="passwordNueva,confirmarNueva" novalidate>
      <div class="campo">
        <label for="passwordNueva">Contraseña nueva</label>
        <input type="password" id="passwordNueva" name="password" data-regla="password" required autocomplete="new-password" data-medidor>
        <span class="ayuda-campo">8 a 30 caracteres, con al menos una letra y un número.</span>
        <span class="mensaje-error-campo">La contraseña no cumple el formato solicitado.</span>
      </div>
      <div class="campo">
        <label for="confirmarNueva">Confirmar contraseña</label>
        <input type="password" id="confirmarNueva" name="confirmar" required autocomplete="new-password">
        <span class="mensaje-error-campo">Las contraseñas no coinciden.</span>
      </div>
      <button type="submit" class="btn btn-primario">Guardar contraseña</button>
    </form>
  </div>
</div>
</main>
